name: Kitsu platform

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: kitsu-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned PlatformIO
        run: python -m pip install platformio==6.1.19 pillow==12.2.0
      - name: Link owner-reflashable Heltec V3 firmware
        run: pio run -e heltec_wifi_lora_32_V3_reflashable
      - name: Local-first Python model, source-contract, layout, and release tests
        run: >-
          python -m unittest
          tests.test_companion_brain_model
          tests.test_advert_repeat_tracking
          tests.test_channel_repeat_tracking
          tests.test_channel_region_scope
          tests.test_connectivity_foundation
          tests.test_gateway_main_integration_source
          tests.test_kitsu_chat_contract
          tests.test_kitsu_mesh_contract
          tests.test_portrait_ui_layout
          tests.test_rx_rearm
          tests.test_rx_observability
          tests.test_species_role_visual_gates
          tests.test_stable_release_tooling
          tests.test_transport_scope
          tests.test_tx_turnaround
      - name: Default-pack release and source-inventory audit
        run: python tools/test_default_pack_release.py
      - name: Expanded-storage portable upload and migration safety gates
        run: |
          python tools/test_platformio_kitsu_upload_guard.py
          python tools/test_migrate_kitsu_0203_storage.py
          python tools/test_kitsu_reflashable_profile.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: MeshCore interoperability vectors
        run: node --test tests/test_meshcore_text_vectors.mjs
      - name: Signed BLE firmware package contract
        run: node --test tools/test_package_kitsu_ble_firmware.mjs

  firmware-native-vectors:
    # The checked-in native-test launchers target the audited VS 2022 toolchain.
    # Pin the image so a windows-latest toolchain rollover cannot block every vector.
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned PlatformIO
        run: python -m pip install platformio==6.1.19
      - name: Install pinned reflashable audit runtime
        shell: cmd
        run: |
          python -m venv ..\esptool411-runtime
          ..\esptool411-runtime\Scripts\python.exe -m pip install --disable-pip-version-check esptool==4.11.0
          ..\esptool411-runtime\Scripts\esptool.exe version
      - name: Link the exact reflashable target on Windows
        run: pio run -e heltec_wifi_lora_32_V3_reflashable
      - name: Strict native C++ local protocol, security, and runtime tests
        shell: cmd
        run: |
          call tools\test_encounter_protocol.cmd || exit /b 1
          call tools\test_kitsu_nearby_protocol.cmd || exit /b 1
          call tools\test_signal_encounter.cmd || exit /b 1
          call tools\test_signal_trail.cmd || exit /b 1
          call tools\test_kitsu_unlock_codes.cmd || exit /b 1
          call tools\test_wild_creature_catalog.cmd || exit /b 1
          call tools\test_kitsu_chat_contract.cmd || exit /b 1
          call tools\test_kitsu_mesh_config.cmd || exit /b 1
          call tools\test_kitsu_mesh_messages.cmd || exit /b 1
          call tools\test_mini_games.cmd || exit /b 1
          call tools\test_companion_fun.cmd || exit /b 1
          call tools\test_portrait_ui_layout.cmd || exit /b 1
          call tools\test_kitsu_companion_protocol.cmd || exit /b 1
          call tools\test_kitsu_device_security.cmd || exit /b 1
          call tools\test_kitsu_legacy_connectivity_retirement.cmd || exit /b 1
          call tools\test_mesh_discovery_journal.cmd || exit /b 1
          call tools\test_kitsu_ble_session.cmd || exit /b 1
          call tools\test_kitsu_ble_action.cmd || exit /b 1
          call tools\test_kitsu_ble_ota.cmd || exit /b 1
          call tools\test_kitsu_flash_layout.cmd || exit /b 1
          call tools\test_kitsu_nvs_erase_guard.cmd || exit /b 1
          call tools\test_kitsu_storage_retry.cmd || exit /b 1
          call tools\test_kitsu_advert_repeat_tracker.cmd || exit /b 1
          call tools\test_kitsu_channel_repeat_tracker.cmd || exit /b 1
          call tools\test_kitsu_endpoint_dispatcher.cmd || exit /b 1
          call tools\test_kitsu_endpoint_rx_policy.cmd || exit /b 1
          call tools\test_kitsu_message_read_contract.cmd || exit /b 1
          call tools\test_kitsu_radio_irq_poll.cmd || exit /b 1
          call tools\test_kitsu_repeat_wire.cmd || exit /b 1
          call tools\test_kitsu_rx_rearm.cmd || exit /b 1
          call tools\test_kitsu_transport_scope.cmd || exit /b 1
          call tools\test_kitsu_tx_turnaround.cmd || exit /b 1
      - name: Expanded-storage upload and migration safety gates
        shell: cmd
        run: |
          python tools\test_platformio_kitsu_upload_guard.py || exit /b 1
          python tools\test_migrate_kitsu_0203_storage.py || exit /b 1
          python tools\test_kitsu_reflashable_profile.py || exit /b 1
      - name: Owner-reflashable and no-eFuse release audits
        shell: cmd
        run: |
          call tools\test_kitsu_reflashable_profile.cmd || exit /b 1
          call tools\test_package_kitsu_reflashable.cmd || exit /b 1

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: platform/mobile/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Permit the checked Gradle wrapper to run
        run: chmod +x gradlew
      - name: Unit, launcher-resource, and release-policy tests
        run: >-
          ./gradlew --no-daemon --dependency-verification strict
          testDebugUnitTest testReleaseUnitTest
      - name: Android lint
        run: >-
          ./gradlew --no-daemon --dependency-verification strict
          lintDebug lintRelease
      - name: Assemble testable application artifacts
        run: >-
          ./gradlew --no-daemon --dependency-verification strict
          assembleDebug assembleAndroidTest verifyDebug16KbPageCompatibility

  android-instrumentation:
    # A pinned AGP-managed virtual device executes the instrumentation contract.
    # This is a CI regression gate; it is never physical release evidence.
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    defaults:
      run:
        working-directory: platform/mobile/android
    steps:
      - uses: actions/checkout@v4
      - name: Permit the managed emulator to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Permit the checked Gradle wrapper to run
        run: chmod +x gradlew
      - name: API 36 managed-device instrumentation contract
        run: >-
          ./gradlew --no-daemon --dependency-verification strict
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          kitsuCiApi36DebugAndroidTest
      - name: Preserve managed-device reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-managed-device-reports
          path: |
            platform/mobile/android/app/build/reports/androidTests/managedDevice/
            platform/mobile/android/app/build/outputs/androidTest-results/managedDevice/
          if-no-files-found: error

  web-serial-flasher:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: platform/flash-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: platform/flash-site/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high

  public-release-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Public release and policy tests
        run: node --test platform/public-site/tests/site.test.mjs
      - name: Static manual contract tests
        run: node --test platform/docs-site/tests/docs.test.mjs
      - name: Cross-surface status, recovery, and encoding tests
        run: node --test platform/flash-site/tests/surfaces.test.mjs
