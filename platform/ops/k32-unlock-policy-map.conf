# Install in nginx's `http` context (for example under `/etc/nginx/conf.d/`).
# The public site keeps Web Serial and cross-origin API access disabled on
# every route except the hardware verification page.
map $request_uri $kitsu_public_site_csp {
    default "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self' 'wasm-unsafe-eval'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self' https://api.k32.run; upgrade-insecure-requests";
    ~^/unlock(?:/|$) "default-src 'self'; connect-src 'self' https://api.k32.run; img-src 'self' data:; style-src 'self'; script-src 'self' 'wasm-unsafe-eval'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self' https://api.k32.run; upgrade-insecure-requests";
}

map $request_uri $kitsu_public_site_permissions_policy {
    default "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), hid=()";
    ~^/unlock(?:/|$) "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(self), hid=()";
}
