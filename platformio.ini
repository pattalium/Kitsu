[platformio]
default_envs = heltec_wifi_lora_32_V3_reflashable

[env:heltec_wifi_lora_32_V3_reflashable]
platform = espressif32@6.13.0
board = heltec_wifi_lora_32_V3
framework = arduino
board_build.partitions = partitions_kitsu_8MB.csv

monitor_speed = 115200
upload_protocol = esptool
upload_speed = 460800

lib_deps =
    https://github.com/jgromes/RadioLib.git#6d8934836678d8894e3d556550475b37dce3e2b6
    h2zero/NimBLE-Arduino@2.5.1
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@4.6.2

build_flags =
    ; Owner-selected, fully functional profile. The board remains recoverable
    ; with the normal USB/UART bootloader and can be repurposed at any time.
    ; Application records are authenticated/encrypted, but their wrapping root
    ; is intentionally recoverable from flash/device identity.
    -DKITSU_SECURITY_MODE_REFLASHABLE=1
    -DCORE_DEBUG_LEVEL=0
    -DRADIOLIB_STATIC_ONLY=1
    -DRADIOLIB_GODMODE=1
    -DLORA_FREQ=869.618
    -DLORA_BW=62.5
    -DLORA_SF=8
    -DLORA_TX_POWER=22
    -Wall
    -Wextra
    -Wformat=2
    -Wno-format-nonliteral
